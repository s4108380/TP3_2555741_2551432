<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flask Calculator</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<!-- Conteneur principal de la calculatrice (centré par style.css) -->
<div class="calculator">
   <h1>Flask Calculator</h1>
   <!-- Le formulaire envoie l'expression en POST vers « / » (champ « display »).
        Le serveur relit ce champ avec request.form.get('display'). -->
   <form method="POST">
      <!-- Afficheur en lecture seule : la saisie passe uniquement par les boutons.
           « result » est fourni par app.py (vide, nombre ou « Error: ... »). -->
      <input type="text" name="display" id="display" value="{{ result }}" readonly>

      <!-- Grille de 4 colonnes : chiffres, opérateurs (+ - * /), C et = -->
      <div class="buttons">
         <button type="button" class="btn" onclick="appendToDisplay('1')">1</button>
         <button type="button" class="btn" onclick="appendToDisplay('2')">2</button>
         <button type="button" class="btn" onclick="appendToDisplay('3')">3</button>
         <button type="button" class="btn operator" onclick="appendToDisplay('+')">+</button>

         <button type="button" class="btn" onclick="appendToDisplay('4')">4</button>
         <button type="button" class="btn" onclick="appendToDisplay('5')">5</button>
         <button type="button" class="btn" onclick="appendToDisplay('6')">6</button>
         <button type="button" class="btn operator" onclick="appendToDisplay('-')">-</button>

         <button type="button" class="btn" onclick="appendToDisplay('7')">7</button>
         <button type="button" class="btn" onclick="appendToDisplay('8')">8</button>
         <button type="button" class="btn" onclick="appendToDisplay('9')">9</button>
         <button type="button" class="btn operator" onclick="appendToDisplay('*')">*</button>

         <button type="button" class="btn" onclick="appendToDisplay('0')">0</button>
         <button type="button" class="btn" onclick="clearDisplay()">C</button>
         <!-- « = » soumet le formulaire ; les autres boutons sont de type « button » pour ne rien envoyer -->
         <button type="submit" class="btn operator">=</button>
         <button type="button" class="btn operator" onclick="appendToDisplay('/')">/</button>
      </div>
   </form>
</div>

<script>
   // Vrai tant que l'afficheur montre un résultat venant du serveur.
   // Permet de repartir de zéro à la prochaine saisie (voir appendToDisplay).
   let resultShown = document.getElementById('display').value !== '';

   /**
    * Ajoute un caractère à la fin de l'afficheur.
    *
    * Si un résultat est affiché et que le caractère est un chiffre, l'afficheur
    * est vidé d'abord (nouveau calcul). Un opérateur, lui, continue à partir
    * du résultat affiché (ex. : « 5 » puis « + »).
    *
    * @param {string} value - Chiffre ou opérateur (+, -, *, /) saisi.
    */
   function appendToDisplay(value) {
      const display = document.getElementById('display');

      if (resultShown && !['+', '-', '*', '/'].includes(value)) {display.value = '';}

      display.value += value;
      resultShown = false;

   }


   /**
    * Vide l'afficheur (bouton « C »).
    * Aucun appel au serveur : le champ est effacé côté navigateur seulement.
    */
   function clearDisplay() {
      document.getElementById('display').value = '';
      resultShown = false;
   }
</script>
</body>
</html>
